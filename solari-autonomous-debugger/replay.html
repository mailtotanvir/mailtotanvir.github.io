<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autonomous Debugger - Evidence Replay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@1.0.0-alpha.4/dist/style.css">
  <style>
    body { margin: 0; padding: 2rem; background: #080b12; color: #e9eef9; font: 16px system-ui, sans-serif; }
    main { max-width: 1240px; margin: auto; }
    a { color: #5ee7b7; }
    #replay { margin-top: 1.5rem; }
    .note { color: #9aa8bf; }
  </style>
</head>
<body>
  <main>
    <p><a href="./">← Read the build story</a></p>
    <h1>Autonomous debugger evidence replay</h1>
    <p class="note">This is the locally retained rrweb recording from the successful Solari browser session. It shows the exact production-only patch accepted after all 53 tests passed. Infrastructure identifiers are redacted by design.</p>
    <div id="replay"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/rrweb-player@1.0.0-alpha.4/dist/index.js"></script>
  <script>
    fetch("./replay.ndjson")
      .then((response) => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.text();
      })
      .then((text) => text.split("\n").filter(Boolean).map(JSON.parse))
      .then((events) => new rrwebPlayer({
        target: document.getElementById("replay"),
        props: { events, autoPlay: false, width: 1200, height: 675 }
      }))
      .catch((error) => {
        document.getElementById("replay").textContent = "Unable to load replay: " + error;
      });
  </script>
</body>
</html>
